services:
# Serviço de banco de dados do mysql. Aqui estamos deifnindo o nome do serviço
# como mysql: outros exemplos de nomes dados ao serviço de banco de dados, são
# db ou database
# Note que para configurar o seviço mysql foi aplicado uma identação e logo
# abaixo o nome da imagem. Estamos definindo a imagem como mysql em sua
# última versão(latest)
# container_name(nome do container)
# restart(reiniciar). Temos as flags: always e unless-stopped. Para a flag
# always, estamos dizendo que o seervidor sempre está reiniciado, mesmo que
# você o desligue manualmente. Quando a máquina for reiniciada o container
# liga automáticamente.
# Quando usamos a flag unless-stopped, se o container de banco de daods
# for desligado manualmente a máquina reiniciar o container não religará.
# # Você terá de dar o comando para ligar o container do banco
  mysql:
    image: mysql:latest
    container_name: srv-mysql
    restart: unless-stopped
    # Comando que serão disponibilizados para as ferrramentas de metricas
    command: 
    # Permite o aceso ao schemas(bancos de dados) do mysql
      - --performance-schema=ON
      # Permite obter as metricas de query(consultas) lentas(slow)
      - --slow-query-log=ON
      # Defini quanto tempo irá esperar para obter as metricas de queries lentas
      - --long-query-time=1
      # Obtem as metricas de queries que não usam indices(chaves)
      - --log-queries-not-using-indexes=ON
      # Permite o acesso e monitoramento das bases que são do engine innodb
      - --innodb-monitor-enable=all
      # Definição de variáveis de ambiente. Estas variáveis devem ser escritas com letras maiúsculas
    environment:
      MYSQL_ROOT_PASSWORD: 123senac
      MYSQL_DATABASE: dbprodutos
      MYSQL_USER: senac
      MYSQL_PASSWORD: 123senac
      # Ports(portas de comunicação do servidor). Configuração: caesso_extremo:acesso_interno,
      # ou seja o valor que é inserido ao lado esquerdo é o número da porta de acesso ao "mundo "
      # externo"  e o número que fica ao lado direito é a porta padrão da aplicação (do serviço)
      # porta interna. Assim, temos 5530:3306, signifca que o acesso externo será pela porta
      # 5030 e o banco(serviço) vai processar pela porta padrão(porta interna) 3306
    ports:
      - "5030:3306"
    # Volume: Deifine onde serão guardados os dados gerados durante o trabalho com o container
    # É um local de armazenamento dos dados, fora do container. Note que estamos apontando
    # o volume de armazenamento para a pasta mysql_data(volume). Os dados do container passam pela
    # pasta /var/lib/mysql/ e são direcionados para a pasta mysqll data(volume). Estes dados
    # não são perdidos quando o container é apagado. Os dados podem ser usados em outros containers.
    volumes:
      - mysql_data:/var/lib/mysql
    # Verificação da saúde ao container
    # Test via terminal(cmd), como admin do mysql, ping(para verificar se o servidor de banco
    # está online), -h (host) verififcar o host como localhost e passar a senha do acesso do root
    healthcheck:
      test: ["CMD", "mysqladmin","ping","-h", "localhost","-p123senac"]
      # Intervalo de verificação da saúde do banco
      interval: 10s
      # tempo de espera para a verificação da saúde do banco
      timeout: 5s
      # Quantas tentativas o container irá fazer a verificação até retornar erro de conexão
      # e/ou saúde instável
      retries: 15
      # Serviço de rede onde os demais serviços estarão conectados 
    networks:
      - monitoring
  
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.19.0
    container_name: mysqld-exporter
    restart: unless-stopped
    command: 
      - "--mysqld.address=mysql:3306" #Definir o serviço e a porta de comunição
      - "--mysqld.username=senac" #Usuário para ter acesso as métricas
      - "--collect.mysql.user" #Coletar dos referente ao usuários
      - "--collect.info_schema.processlist" #Coletas dados de processo ativos: conexões, queries em ex 
      - "--collect.info_schema.tables" #Coleta dados sobre as tabelas: linhas, tamanhos, colunas,
      - "--collect.info_schema.innodb_metrics" #Coleta metricas dos bancos que estão na coleção innod
      - "--collect.info_schema.innodb_tablespaces" #Estatisticas de comandos(Statement) sql
      - "--collect.perf_schema.eventsstatements" #Soma de das estatisticas de comandos
      - "--collect.perf_schema.eventswaits" #tempo de espera para monitoramento das estatisticas
      - "--collect.perf_schema.file_events" #arquivos de monitoramento dos comdos
      - "--collect.perf_schema.file_instances" #Estatisticas por instancias de banco de dados
      - "--collect.perf_schema.indexiowaits" #Espera de IO(input|out) em arquivos de banco de dados
      - "--collect.perf_schema.memory_events" #Estatisticas relacionadas ao uso de memória
      - "--collect.perf_schema.tableiowaits" #Espera por entrada e saída de dados em tabelas
      - "--collect.perf_schema.tablelocks" #Estatistica de qaunto tempo a tabela ficou bloqueada
      - "--collect.engine_innodb_status" #Coleta status de bancos de dados de coleção innodb
    ports:
      - "9104:9104"
    
    environment:
      MYSQLD_EXPORTER_PASSWORD: 123senac
      # Este serviço depende de banco de dados mysql. Portanto, o comando
      # depends_on nos diz de quem mysql-exporter depende para funcionar.
      # Neste caso, estamos dizendo que o exporter depende do mysql. Mas, não isso.
      # estamos dizendo que o serviço de banco de dados deve ter a condição de
      # "saúde" esteja saúdavel(service_healthy)
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: always
    command: 
    # Nesta linha, foi setado(apontado) o local do arquivo de configuração
    # do prometheus, onde encontramos as ferramentas de métricas que serão
    # usada para armazenar os dados e depois passados ao grafana
      - "--config.file=/etc/prometheus/prometheus.yml"
    # Tempo de retenção(armazenamento) dos dados por 15 dias
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - mysql
      - mysqld-exporter
      - cadvisor
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
  
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    networks:
      - monitoring

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge