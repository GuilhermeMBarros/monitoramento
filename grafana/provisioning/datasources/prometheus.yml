# Este arquivo será lido pelo docker compose e 
# montado a partir da linha de comandos
# /etc/grafana/provisioning dentro do container do Grafana

# O Grafana lê automaticamente todos os arquivos
# YAML desta pasta na inicialização do container grafana
# e, cria/atualiza os datasources definidos
# sem necessidade de configuração manual via interface Web.

# apiVersion: 1 é a versão do formato do arquivo de
# provisionamento do grafana.
apiVersion: 1

# datasource é a origem dos dados, ou seja, é de onde
# viram as metricas para serem exibidas no dashboard
datasources:
# Nome que aparece na lista de datasources dentro do grafana
  - name: Prometheus
# Tipo de datasource(plugin nativo do grafana)
    type: prometheus
# Modo proxy, as requisisções passam pelo backend do grafana
# o ususário acessa os dados de metricas, via dashboard do
# grafana sem ter acessso ao prometheus#
    access: proxy
# Endereço de conexão do prometheus com o grafana.
# Aquilo está sendo o nome do serviço o docker criado
# para o prometheus.
    url: http://localhost:9090
# Define este datasources como padrão ao criar novos datasurces
# dentro do grafana
    isDefault: true
# Indica que este datasources é editável manualente.
# Podemos altearar as configurações dentro do grafana.
    editable: true